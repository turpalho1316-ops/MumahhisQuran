name: Build Mumahhis Quran APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "MumahhisQuran-v0.9.0-GitHub.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP not found"
            ls -la
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS=$(find extracted -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show QuranMatcher.java
        shell: bash
        run: |
          echo "=== QuranMatcher.java (lines 1-80) ==="
          sed -n '1,80p' "$PROJECT_DIR/app/src/main/java/com/mumahhis/quran/QuranMatcher.java"

      - name: Patch QuranMatcher.java
        shell: bash
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/mumahhis/quran/QuranMatcher.java"
          sed -i "s/\.replace('', '')/.replace(' ', '')/g" "$FILE"
          echo "=== After patch, lines 25-40 ==="
          sed -n '25,40p' "$FILE"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MumahhisQuran-debug-apk
          path: |
            **/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
