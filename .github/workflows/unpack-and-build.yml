name: Build Mumahhis Quran APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "MumahhisQuran-v0.9.0-GitHub.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "MumahhisQuran ZIP was not found."
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: extracted/MumahhisQuran
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MumahhisQuran-debug-apk
          path: extracted/MumahhisQuran/app/build/outputs/apk/debug/app-debug.apk
